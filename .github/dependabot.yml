version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      day: sunday
      time: "18:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    labels:
      - "chore"
    commit-message:
      prefix: "chore"
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
