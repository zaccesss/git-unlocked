name: Check Links

permissions:
  contents: read

on:
  schedule:
    - cron: "0 8 * * 1"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  linkchecker:
    name: Check for broken links
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --insecure
            --timeout 30
            --max-retries 5
            --retry-wait-time 3
            --accept 200,202,403,405,429,400,502,503
            --exclude-path '.github'
            --exclude 'localhost'
            --exclude 'github.com/settings'
            --exclude 'gitlab.com/-/user_settings'
            --exclude 'docs.gitlab.com'
            --exclude 'status.atlassian.com'
            --exclude 'account.microsoft.com'
            --exclude 'reddit.com'
            --exclude 'netflixtechblog.com'
            --exclude 'oliviac.dev'
            --exclude '://gitea.com'
            --exclude '://demo.gitea.com'
            --exclude 'gitexplorer.com'
            --exclude 'slsa.dev'
            --exclude 'learn.microsoft.com/azure/devops/cli/sign-in-with-pat'
            --exclude 'jvns.ca'
            --exclude 'nova.app'
            --exclude 'file://'
            '**/*.md'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
