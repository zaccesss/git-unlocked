title: "[Idea] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Share an idea for new content, a new section or an improvement to an existing file.
        Describe the problem or gap you have noticed before jumping straight to a solution — it helps evaluate whether the idea fits the direction of the course.

  - type: textarea
    id: problem
    attributes:
      label: What is missing or unclear?
      description: What gap or frustration prompted this idea?
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: Describe the idea. Which section would it belong in? What would it cover?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered (optional)
      description: Have you worked around this in another way or found another resource that covers it?
