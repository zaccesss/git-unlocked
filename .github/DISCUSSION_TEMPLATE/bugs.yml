title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        > **This category is for discussing potential errors, not reporting confirmed ones.**
        > To report a confirmed mistake in the course content, please [open an Issue](https://github.com/zaccesss/git-unlocked/issues/new?template=bug_report.md) where it can be tracked properly.

        Use this Discussion category if you are unsure whether something is wrong, or if you want to check with others before filing a formal report.

  - type: textarea
    id: description
    attributes:
      label: What did you observe?
      description: Describe what the file currently says and what you expected it to say instead.
    validations:
      required: true

  - type: input
    id: file
    attributes:
      label: Which file is this in?
      description: For example — 02-git/06-branching.md or 03-github/04-pull-requests.md
    validations:
      required: true
