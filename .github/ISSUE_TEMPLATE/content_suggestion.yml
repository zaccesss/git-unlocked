name: Content suggestion
description: Suggest a new topic, section or improvement to the course
title: "suggestion: "
labels: ["enhancement"]
assignees:
  - zaccesss
body:
  - type: textarea
    id: suggestion
    attributes:
      label: What would you like to see added or improved?
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Which folder or file does this relate to?
      placeholder: "git/, github/, reference/cheatsheet.md or a completely new section"
    validations:
      required: false
  - type: textarea
    id: benefit
    attributes:
      label: Why would this help learners?
      description: Who would benefit and how?
    validations:
      required: true
  - type: dropdown
    id: willing
    attributes:
      label: Are you willing to write or help write this content?
      options:
        - "Yes, I can write this"
        - "Yes, I can help but need guidance"
        - "No, just suggesting"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Any examples, references or links that might be useful.
    validations:
      required: false
  - type: dropdown
    id: ai-use
    attributes:
      label: AI use
      description: "Required. Did AI help you find, test or check this? Write the title and description yourself either way. See the [AI policy](https://github.com/zaccesss/ai-policy). Dictation, translation and spelling tools do not count."
      options:
        - No AI was used
        - "Yes: AI helped me find, test or check it"
    validations:
      required: true
